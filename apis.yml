  reason: no-developer-program
  detail: >-
    Remarkable AI (Chatdesk, Inc.) sells an AI-plus-human customer-engagement service, not
    a developer product: its 34 "one-click integrations" all consume OTHER vendors' APIs
    inbound, and across seven hosts on two domains the only API surfaces that exist are
    internal app plumbing — api.chatdesk.com answers HTTP 403 "Missing Authentication
    Token" on every path including the root, and the Spring Boot springdoc endpoint at
    trends.chatdesk.com/v3/api-docs HTTP 302s to /logout — while the marketing site, the
    59-entry help-center llms.txt and the integrations page contain zero occurrences of
    "API", "webhook", "API key" or "developer".

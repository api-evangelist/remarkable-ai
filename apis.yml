name: Remarkable AI
description: 'Remarkable AI is an AI-powered customer engagement platform for consumer
  and ecommerce brands, delivering 1:1 personalized messaging across email, SMS, and
  social channels. Its products span Retain (personalized win-back campaigns for lapsed
  customers), Support (24/7 AI-plus-human customer service that converts tickets into
  sales), and Acquire (AI-driven social engagement on TikTok, YouTube, X, and Reddit).
  The platform is used by 1,000+ ecommerce brands including SAXX, Hyper Skin, Nomadica,
  Kindra, StoryWorth, and Hot Topic, with plans starting at $1,500/month. Remarkable
  AI is the trading name of Chatdesk, Inc., which rebranded in 2024; its own terms of
  service state "We (Chatdesk, Inc. DBA Remarkable AI)", and the legacy chatdesk.com
  brand still carries the live pricing page, the responsible-disclosure program, and the
  Teams/Trends/Shift product surfaces. Remarkable AI was surfaced as a portfolio company
  of Partech and added to the API Evangelist network. It integrates INBOUND with roughly
  34 third-party platforms (Shopify, Gorgias, Zendesk, Klaviyo, Kustomer, Freshdesk,
  Salesforce, TikTok and others) by consuming their APIs, but publishes no outbound API
  of its own: no OpenAPI, GraphQL SDL, MCP server, agent card, SDK, CLI, webhook catalog
  or developer portal was found across seven hosts on two domains.'

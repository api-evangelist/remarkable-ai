name: Remarkable AI
description: 'Remarkable AI is an AI-powered customer engagement platform for consumer
  and ecommerce brands, delivering 1:1 personalized messaging across email, SMS, and
  social channels. Its products span Retain (personalized win-back campaigns for lapsed
  customers), Support (24/7 AI-plus-human customer service that converts tickets into
  sales), and Acquire (AI-driven social engagement on TikTok, YouTube, X, and Reddit).
  The platform is used by 1,000+ ecommerce brands including SAXX, Hyper Skin, Nomadica,
  Kindra, StoryWorth, and Hot Topic, with plans starting at $1,500/month. Remarkable
  AI was surfaced as a portfolio company of Partech and added to the API Evangelist
  network. It publishes no public developer API, SDKs, or developer documentation as
  of this enrichment pass.'

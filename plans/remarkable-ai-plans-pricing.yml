# WHAT IS BEING PRICED — read this before using the numbers.
# These are SERVICE plans for an AI-plus-human customer-engagement service sold to
# ecommerce brands. They are NOT API plans. Remarkable AI publishes no API, so there is
# no per-call, per-token or per-endpoint pricing to record. The unit of billing is a
# resolved ticket, a personalized conversation, or a confirmed social engagement.
#
# BRAND NOTE (STEP 0c ownership justification for a different domain):
# The pricing page is on the legacy brand's domain. https://www.beremarkable.ai/legal/terms
# states verbatim: "We (Chatdesk, Inc. DBA Remarkable AI) create software and solutions..."
# — Remarkable AI is the trading name of Chatdesk, Inc., which rebranded in 2024. The
# current brand's own site publishes NO pricing page at all: its sitemap
# (https://www.beremarkable.ai/sitemap.xml, HTTP 200) lists 28 URLs and contains no
# /pricing, only /book-a-demo and /revenue-calculator. The live, publicly readable price
# list is therefore the one still standing at www.chatdesk.com/pricing.

